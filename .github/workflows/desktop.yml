name: Desktop Build
on:
  push:
    branches:
      - dev*
    paths:
      - "desktop/**"
      - "app/src/main/**"
      - "library/**"
      - "packaging/**"
      - "buildSrc/**"
      - "bin/desktop/**"
      - "gradle/**"
      - "version.properties"
      - ".github/workflows/desktop.yml"
      - ".github/actions/build-desktop/**"
    tags:
      - "desktop-v*"
      - "v*"
      - "0.*"
  workflow_dispatch:
    inputs:
      release:
        description: 'Release (y/n)'
        required: false
      tag:
        description: 'Release Tag'
        required: false

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            target: linux/amd64
            artifact: linux-x64
            tag: linux-amd64
          - name: macOS x64
            os: macos-26-intel
            target: darwin/amd64
            artifact: macos-x64
            tag: darwin-amd64
          - name: Windows x64
            os: windows-latest
            target: windows/amd64
            artifact: windows-x64
            tag: windows-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build and verify desktop target
        uses: ./.github/actions/build-desktop
        with:
          target: ${{ matrix.target }}
          artifact: ${{ matrix.artifact }}
          tag: ${{ matrix.tag }}

  build-macos-arm64:
    name: macOS arm64
    runs-on: xcode-27
    continue-on-error: true
    outputs:
      started: ${{ steps.desktop.outputs.started }}
      succeeded: ${{ steps.desktop.outputs.succeeded }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build and verify desktop target
        id: desktop
        uses: ./.github/actions/build-desktop
        with:
          target: darwin/arm64
          artifact: macos-arm64
          tag: darwin-arm64

  build-macos-arm64-fallback:
    name: macOS arm64 (fallback pool)
    needs: [build, build-macos-arm64]
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.build-macos-arm64.outputs.succeeded != 'true' &&
      needs.build-macos-arm64.outputs.started != 'true'
    runs-on: macos-26
    continue-on-error: true
    outputs:
      started: ${{ steps.desktop.outputs.started }}
      succeeded: ${{ steps.desktop.outputs.succeeded }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build and verify desktop target
        id: desktop
        uses: ./.github/actions/build-desktop
        with:
          target: darwin/arm64
          artifact: macos-arm64
          tag: darwin-arm64

  verify-macos-arm64:
    name: Verify macOS arm64 outcome
    needs: [build, build-macos-arm64, build-macos-arm64-fallback]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check macOS arm64 test status
        env:
          PRIMARY_STARTED: ${{ needs.build-macos-arm64.outputs.started }}
          PRIMARY_SUCCEEDED: ${{ needs.build-macos-arm64.outputs.succeeded }}
          FALLBACK_STARTED: ${{ needs.build-macos-arm64-fallback.outputs.started }}
          FALLBACK_SUCCEEDED: ${{ needs.build-macos-arm64-fallback.outputs.succeeded }}
          IS_RELEASE_RUN: ${{ (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/desktop-v') || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/0.'))) || (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'y') }}
        run: |
          set -euo pipefail
          if [ "$PRIMARY_STARTED" = "true" ] && [ "$PRIMARY_SUCCEEDED" != "true" ]; then
            echo "::error::macOS arm64 acquired a runner on primary pool and failed build/tests"
            exit 1
          fi
          if [ "$FALLBACK_STARTED" = "true" ] && [ "$FALLBACK_SUCCEEDED" != "true" ]; then
            echo "::error::macOS arm64 acquired a runner on fallback pool and failed build/tests"
            exit 1
          fi
          if [ "$PRIMARY_SUCCEEDED" = "true" ] || [ "$FALLBACK_SUCCEEDED" = "true" ]; then
            echo "::notice::macOS arm64 verified and packaged cleanly"
          elif [ "$IS_RELEASE_RUN" = "true" ]; then
            echo "::error::Refusing to publish an incomplete release without macOS arm64 artifacts (both Apple Silicon pools timed out)"
            exit 1
          else
            echo "::warning::Both GitHub-hosted Apple Silicon pools timed out waiting for VM capacity"
          fi

  publish:
    name: Publish Release
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.verify-macos-arm64.result == 'success' &&
      (
        (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/desktop-v') || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/0.'))) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'y' && github.event.inputs.tag != '')
      )
    runs-on: ubuntu-latest
    needs: [build, build-macos-arm64, build-macos-arm64-fallback, verify-macos-arm64]
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Collect assets and write release notes
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "TAG=${TAG}" >>"$GITHUB_ENV"
          version="$(grep -E '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '[:space:]')"
          desktop_version="$(printf '%s' "$version" | sed -E 's/^0+(\.)/1\1/')"
          echo "VERSION=${version}" >>"$GITHUB_ENV"
          echo "DESKTOP_VERSION=${desktop_version}" >>"$GITHUB_ENV"
          rm -rf release notes.md base-notes.md
          mkdir -p release
          while IFS= read -r file; do
            rel="${file#artifacts/}"
            leg="${rel%%/*}"
            short="${leg#owenclave-desktop-}"
            base="$(basename "$file")"
            case "$base" in
              *-portable.zip) target="$base" ;;
              *) target="${base%.*}-${short}.${base##*.}" ;;
            esac
            cp "$file" "release/$target"
          done < <(find artifacts -type f \( -name "*.zip" -o -name "*.dmg" -o -name "*.msi" -o -name "*.deb" -o -name "*.rpm" \) | sort)
          mkdir -p arch
          find artifacts/owenclave-arch-repo -type f -name '*.pkg.tar.zst' -exec cp {} release/ \; 2>/dev/null || true
          find artifacts/owenclave-arch-repo -type f \( -name '*.pkg.tar.zst' -o -name 'owenclave.db*' -o -name 'owenclave.files*' \) -exec cp {} arch/ \; 2>/dev/null || true
          count=$(find release -type f | wc -l)
          echo "collected $count asset(s) for ${TAG:-manual}"
          ls -la arch 2>/dev/null || true
          ls -la release
          test "$count" -gt 0

          previous="$(git tag --list 'v[0-9]*' '[0-9]*' --sort=-creatordate | grep -Fxv "$TAG" | head -n1 || true)"
          repo="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          if [ -n "$previous" ]; then
            link="${repo}/compare/${previous}...${TAG}"
          else
            link="${repo}/commits/${TAG}"
          fi
          if [ -f "docs/releases/${version}.md" ]; then
            cat "docs/releases/${version}.md" > base-notes.md
            printf '\n' >> base-notes.md
          else
            : > base-notes.md
          fi
          printf '**Full Changelog**: %s\n' "$link" >> base-notes.md

          cat > notes.md <<'NOTES'
          <!-- desktop-notes -->
          ## Desktop Client (`__DESKTOP_VERSION__`)

          Desktop client for Linux, macOS and Windows built from Android version
          `__VERSION__` (desktop package version `__DESKTOP_VERSION__`). It shares the
          Android Material 3 Expressive 7-tab Compose UI, protocol layer and Go engine
          (`owenclave-core` + `libgojni` + `naive` + `tun2socks`), so profiles, share
          links (`owenclave://`, `owenkey://`, `happ://`, `vless://`, ...), Clash YAML
          and V2Ray/sing-box JSON behave identically to Android.

          ### Downloads

          | Platform | Portable (unpack and run) | Installer / Package |
          | --- | --- | --- |
          | Windows x64 | `owenclave-desktop-__DESKTOP_VERSION__-windows-amd64-portable.zip` | `Owenclave-__DESKTOP_VERSION__-windows-x64.msi` |
          | macOS arm64 | `owenclave-desktop-__DESKTOP_VERSION__-darwin-arm64-portable.zip` | `Owenclave-__DESKTOP_VERSION__-macos-arm64.dmg` |
          | macOS x64 | `owenclave-desktop-__DESKTOP_VERSION__-darwin-amd64-portable.zip` | `Owenclave-__DESKTOP_VERSION__-macos-x64.dmg` |
          | Linux x64 | `owenclave-desktop-__DESKTOP_VERSION__-linux-amd64-portable.zip` | `owenclave___DESKTOP_VERSION___amd64-linux-x64.deb`, `owenclave-__DESKTOP_VERSION__-1.x86_64-linux-x64.rpm`, `owenclave-desktop-__DESKTOP_VERSION__-1-x86_64.pkg.tar.zst` |

          ### Notes

          * **Arch Linux repository**: install and keep updated with `pacman -Syu`:
            `sudo bash -c "$(curl -fsSL https://raw.githubusercontent.com/__REPO__/dev/packaging/arch/setup-repo.sh)"`
          * **Service modes**: supports **VPN (TUN)** (prompts via Polkit `pkexec` / graphical askpass on Linux, or Administrator on Windows/macOS), **System Proxy** (GNOME/KDE, macOS `networksetup`, Windows WinINet with automatic restore), and **Proxy Only** (local SOCKS/HTTP listeners).
          * **macOS Gatekeeper**: unsigned `.dmg` bundles ask once on first launch — right-click then Open, or run `xattr -dr com.apple.quarantine /Applications/Owenclave.app`.
          * **Version scheme**: desktop installers use `1.a.b` for Android version `0.a.b` because `jpackage` rejects a leading `0` major version on macOS.
          <!-- /desktop-notes -->
          NOTES
          sed -i "s|__VERSION__|${version}|g; s|__DESKTOP_VERSION__|${desktop_version}|g; s|__REPO__|${GITHUB_REPOSITORY}|g" notes.md
          echo "--- desktop release notes ---"
          cat notes.md
      - name: Publish or update the release
        run: |
          set -euo pipefail
          is_prerelease="false"
          release_title="Owenclave ${TAG}"
          case "$TAG" in
            desktop-v*)
              is_prerelease="true"
              release_title="Owenclave desktop ${DESKTOP_VERSION} (${VERSION})"
              ;;
            *-*)
              is_prerelease="true"
              ;;
          esac

          build_combined_notes() {
            local existing_body
            existing_body="$(gh release view "$TAG" --json body --jq '.body' 2>/dev/null || true)"
            python3 - "$existing_body" <<'PY'
          import re, sys
          existing = sys.argv[1]
          with open("notes.md", "r", encoding="utf-8") as f:
              desktop_block = f.read().strip()
          with open("base-notes.md", "r", encoding="utf-8") as f:
              fallback_base = f.read().strip()
          cleaned = re.sub(r"<!-- desktop-notes -->.*?<!-- /desktop-notes -->", "", existing, flags=re.S).strip()
          base = cleaned if cleaned else fallback_base
          out = f"{base}\n\n{desktop_block}\n" if base else f"{desktop_block}\n"
          with open("combined-notes.md", "w", encoding="utf-8") as f:
              f.write(out)
          PY
          }

          publish_existing() {
            echo "updating the existing release $TAG"
            build_combined_notes
            gh release upload "$TAG" ./release/* --clobber
            if [ "$is_prerelease" = "true" ]; then
              gh release edit "$TAG" --title "$release_title" --notes-file combined-notes.md --prerelease --latest=false
            else
              gh release edit "$TAG" --title "$release_title" --notes-file combined-notes.md --prerelease=false
            fi
          }

          if gh release view "$TAG" >/dev/null 2>&1; then
            publish_existing
          else
            build_combined_notes
            if [ "$is_prerelease" = "true" ]; then
              if ! gh release create --prerelease --latest=false "$TAG" \
                --title "$release_title" \
                --notes-file combined-notes.md \
                ./release/*; then
                publish_existing
              fi
            else
              if ! gh release create "$TAG" \
                --title "$release_title" \
                --notes-file combined-notes.md \
                ./release/*; then
                publish_existing
              fi
            fi
          fi
          gh release view "$TAG"

          if [ -n "$(ls -A arch 2>/dev/null)" ]; then
            if ! gh release view desktop-repo >/dev/null 2>&1; then
              gh release create desktop-repo --latest=false --title "Arch repository" \
                --notes "pacman repository for owenclave-desktop.\n\nInstall with:\n\n    sudo bash -c \"\$(curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/dev/packaging/arch/setup-repo.sh)\""
            fi
            gh release upload desktop-repo ./arch/* --clobber
            echo "uploaded the Arch repository assets"
          fi
