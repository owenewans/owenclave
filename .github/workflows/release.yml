name: Release Build
on:
  push:
    branches:
      - dev*
    paths:
      - "app/**"
      - "buildSrc/**"
      - "library/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      release:
        description: 'Release (y/n)'
        required: false
      prerelease:
        description: 'Mark as pre-release (y/n)'
        required: false
      tag:
        description: 'Release Tag'
        required: false
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache-dependency-path: "library/core/go.sum"
      - name: Setup Go Mobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260803200217-62cee1672c8e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260803200217-62cee1672c8e
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
      - name: Native Build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ./run lib core
          ./bin/lib/olcrtc/build.sh
          ./bin/lib/naive/download.sh
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            test -s "app/src/main/jniLibs/$abi/libolcrtc.so"
            test -s "app/src/main/jniLibs/$abi/libnaive.so"
          done
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          path: app/libs/libexclavecore.aar
          name: "LibOwenclaveCore"
      - name: Decode Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.OWENCLAVE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > owenclave.jks
      - name: Gradle Cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle.kts') }}
      - name: Gradle Build
        env:
          KEYSTORE_PATH: ${{ secrets.OWENCLAVE_KEYSTORE_BASE64 != '' && '../owenclave.jks' || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.OWENCLAVE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OWENCLAVE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OWENCLAVE_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./gradlew :app:downloadAssets
          ./gradlew :app:assembleOssRelease
          APK="app/build/outputs/apk/oss/release"
          echo "APK=$APK" >> $GITHUB_ENV
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: APKs
          path: ${{ env.APK }}
  publish:
    name: Publish Release
    if: github.event.inputs.release == 'y' && github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    needs: build
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: APKs
          path: artifacts
      - name: Publish Pre-release
        if: github.event.inputs.prerelease == 'y'
        run: |
          mkdir apks
          find artifacts -name "*.apk" -exec cp {} apks \;
          gh release create ${{ github.event.inputs.tag }} --notes="" --title=${{ github.event.inputs.tag }} --prerelease ./apks/*
      - name: Publish Release
        if: github.event.inputs.prerelease != 'y'
        run: |
          mkdir apks
          find artifacts -name "*.apk" -exec cp {} apks \;
          gh release create ${{ github.event.inputs.tag }} --notes="" --title=${{ github.event.inputs.tag }} ./apks/*
