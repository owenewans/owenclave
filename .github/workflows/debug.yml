name: Debug Build
on:
  push:
    branches:
      - dev*
    paths:
      - "app/**"
      - "buildSrc/**"
      - "library/**"
      - ".github/workflows/debug.yml"
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.3
          cache-dependency-path: "library/core/go.sum"
      - name: Setup Go Mobile
        # https://github.com/golang/mobile/blob/c31d5b91ecc32c0d598b8fe8457d244ca0b4e815/cmd/gomobile/init.go#L83
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20261011034528-197770444867
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'gradle'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
      - name: Native Build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          GOFLAGS: -p=2
          GOMAXPROCS: 2
        run: |
          ./run lib core debug
          ./bin/lib/naive/download.sh
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            test -s "app/src/main/jniLibs/$abi/libnaive.so"
          done
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          path: app/libs/libexclavecore.aar
          name: "LibOwenclaveCore"
      - name: Gradle Cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle
          key: gradle-debug-${{ hashFiles('**/*.gradle.kts') }}
      - name: Gradle Build
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./gradlew :app:downloadAssets
          ./gradlew :app:assembleOssDebug :app:assembleLegacyDebug
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: APKs
          path: app/build/outputs/apk/oss/debug
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: APKs-legacy
          path: app/build/outputs/apk/legacy/debug
